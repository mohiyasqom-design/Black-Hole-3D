name: Record Showcase

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      duration:
        description: "Recording duration in seconds"
        required: false
        default: "30"

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --include=dev

      - name: Verify recorder dependencies
        run: node -e "console.log(require.resolve('playwright')); console.log(require.resolve('wait-on'))"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Install FFmpeg and Xvfb
        run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb

      - name: Build
        run: npm run build

      - name: Start preview server
        run: npm run preview -- --host 0.0.0.0 --port 4173 > /tmp/bhl-server.log 2>&1 &

      - name: Wait for server
        run: npx wait-on http://127.0.0.1:4173

      - name: Start fixed 1080p display
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset &
          echo $! > /tmp/xvfb.pid
          sleep 2

      - name: Record 1080p Showcase
        env:
          DISPLAY: :99
          DURATION: ${{ github.event.inputs.duration }}
        run: node scripts/record-showcase.mjs

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: black-hole-showcase-1080p
          path: artifacts/black-hole-showcase-1080p.mp4
          if-no-files-found: error
          retention-days: 7
